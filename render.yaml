# Render Blueprint — Black Legislation Tracker (Phase 1 deploy)
#
# How to use: push this repo to GitHub, then in the Render dashboard
# choose New > Blueprint, select the repo, and Apply. Render reads this
# file and creates the web service and the Postgres database below.
#
# WHY NO CRON SERVICE: Render cron jobs have no free plan — including
# one made Render demand a payment method for the whole Blueprint.
# Daily ingestion therefore runs OUTSIDE Render (from Jared's agent
# infrastructure) and writes to this same Postgres via its external
# connection string; the API keys live in that runner's secure storage,
# never in this repo and never in Render.
#
# DATA FLOW (Postgres backend is wired): DATABASE_URL is injected into
# the web service from the managed Postgres below. Wherever
# DATABASE_URL is set, legitrack uses PostgresStore — ingestion writes
# to Postgres (applying schema.sql idempotently) and the web service
# reads from the same database, so the site shows live counts once the
# first ingestion run lands. The SQLite LEGITRACK_DB below is only the
# local/dev default and is ignored while DATABASE_URL is present.
#
# Honest notes that remain true:
#   * The site shows data only after the first ingestion run populates
#     Postgres. Before that, the landing page says no data is
#     available rather than showing invented numbers.
#   * Ingestion covers North Carolina only for now (all-state rollout
#     is an ingestion command change).
#   * Render's free Postgres expires after ~30 days — upgrade or export
#     before then if this deploy becomes permanent.

databases:
  - name: legitrack-db
    plan: free
    databaseName: legitrack
    user: legitrack

services:
  # (a) Public web app — reads Postgres via DATABASE_URL (see header)
  - type: web
    name: black-legislation-tracker
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && pip install ."
    startCommand: "uvicorn legitrack.web:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: LEGITRACK_DB
        value: legitrack.db   # local/dev fallback only; DATABASE_URL takes precedence
      - key: DATABASE_URL
        fromDatabase:
          name: legitrack-db
          property: connectionString
